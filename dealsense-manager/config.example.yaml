# Dealsense Configuration Example
# Copy this file to config.yaml and customize for your environment

server:
  host: "0.0.0.0"
  port: 8001
  read_timeout: 30s
  write_timeout: 30s
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "https://your-production-domain.com"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Origin"
      - "Content-Type"
      - "Accept"
      - "Authorization"

logging:
  level: "info"  # Options: debug, info, warn, error
  format: "text"  # Options: text, json
  discord:
    enabled: false
    webhook_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_URL"
    min_level: "error"  # Only send error and above to Discord
  file:
    enabled: true
    path: "logs/dealsense.log"
    max_size_mb: 100
    max_backups: 3
    max_age_days: 30

joinly:
  default_url: "http://localhost:8000"
  default_timeout: 30s
  max_agents: 10
  polling:
    enabled: true
    interval_seconds: 5

# Google Cloud Platform Configuration
google:
  api_key: ""  # Optional: For Gemini API if not using Vertex AI
  project_id: "your-gcp-project-id"

  # Google Cloud Storage Configuration
  storage:
    bucket_name: "dealsense-documents"
    use_default_credentials: true  # Set to false if using credentials_json
    credentials_json: ""  # Optional: Inline JSON credentials

  # Document AI Configuration
  # Automatically uses:
  #   - Sync processing for ≤15 pages (30-60 seconds)
  #   - Batch processing for >15 pages (10-30 minutes)
  document_ai:
    location: "us"  # Options: "us", "eu"
    processor_id: "your-document-ai-processor-id"  # Create at: https://console.cloud.google.com/ai/document-ai
    use_default_credentials: true
    credentials_json: ""

  # Vertex AI Configuration
  vertex_ai:
    location: "us-central1"
    embedding_model: "text-embedding-004"  # 768 dimensions
    use_default_credentials: true
    credentials_json: ""

    # Vector Search Configuration
    # Benefits: 50-100x faster search, scalable to millions of vectors
    # To create: See CONFIG_DOCUMENTATION.md "Setting up Vector Search" section
    vector_search:
      enabled: false  # Set to true once Vector Search is set up
      project_number: ""  # Optional: GCP project number (e.g., "33593473489"). If not set, uses project_id above.
      index_id: "your-vector-search-index-id"  # Just the numeric ID (e.g., "3413880250151469056")
      index_endpoint_id: "your-vector-search-endpoint-id"  # Just the numeric ID (e.g., "6674108148367753216")
      deployed_index_id: "dealsense_deployed"  # Optional: ID used during deployment. Defaults to "dealsense_deployed".
      public_endpoint_domain: ""  # REQUIRED: Public VDB endpoint (e.g., "266063970.us-central1-33593473489.vdb.vertexai.goog")
                                  # Get with: gcloud ai index-endpoints describe INDEX_ENDPOINT_ID --region=REGION --project=PROJECT_ID --format="value(publicEndpointDomainName)"

# Database Configuration
database:
  type: "postgres"
  host: "localhost"
  port: 5432
  user: "dealsense"
  password: "your-secure-password"  # Use environment variable in production
  dbname: "dealsense"
  sslmode: "disable"  # Set to "require" in production with SSL certs
  delete_existing_data_on_startup: false  # WARNING: Set to true only in development

# Notes:
# 1. Use environment variables for sensitive data:
#    - GOOGLE_APPLICATION_CREDENTIALS for service account
#    - DATABASE_PASSWORD for database password
# 
# 2. Vector Search Setup (optional but highly recommended for production):
#    a. Create Vector Search index (see CONFIG_DOCUMENTATION.md)
#    b. Deploy index to endpoint
#    c. Update index_id and index_endpoint_id above
#    d. Set enabled: true
#
# 3. Document Processing:
#    - ≤15 pages: Processed immediately (sync)
#    - >15 pages: Processed via batch API (poll status with GET /documents/{id}/status)
#
# 4. Performance:
#    - Vector Search: ~75ms search latency
#    - PostgreSQL JSONB: ~4000ms search latency (fallback)
#
# 5. Chat Behavior:
#    - Works with documents only, transcripts only, or both
#    - Gracefully handles missing data with informative messages

